name: Build DMG (Mac)

on:
  workflow_dispatch:
  push:
    branches: [claude/brave-planck-0grxwg]
    paths: ['src/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/build-dmg.yml']

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Brainacho-dmg
          path: dist/*.dmg
          if-no-files-found: error
